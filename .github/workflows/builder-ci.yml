name: Builder CI

on:
  pull_request:
    paths:
      - "Builder/**"
      - ".github/workflows/builder-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Builder/**"
      - ".github/workflows/builder-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builder-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Builder
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: Builder/.fvmrc
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded

  android-release-build:
    name: Android arm64 release compile
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: Builder/.fvmrc
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release --target-platform android-arm64 --dart-define=APP_ENV=staging

  ios-release-build:
    name: iOS release compile
    needs: validate
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Builder
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: Builder/.fvmrc
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign --dart-define=APP_ENV=staging
