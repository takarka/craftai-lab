<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Персонаж ассистента</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 320px; height: 400px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #F3F5FA; font-family: 'Onest', sans-serif">
<svg viewBox="0 0 200 200" width="240" height="240" role="img" aria-label="Персонаж ассистента, уровень {{level}}">
<g opacity="{{o1}}">
<line x1="100" y1="56" x2="100" y2="36" stroke="#0B1B33" stroke-width="5" stroke-linecap="round"/>
<circle cx="100" cy="28" r="10" fill="#E8772E"/>
</g>
<g opacity="{{o5}}">
<rect x="62" y="158" width="26" height="22" rx="8" fill="#0B1B33"/>
<rect x="112" y="158" width="26" height="22" rx="8" fill="#0B1B33"/>
</g>
<rect x="40" y="56" width="120" height="108" rx="34" fill="#0047BA"/>
<rect x="56" y="76" width="88" height="58" rx="22" fill="#E3ECFB"/>
<circle cx="82" cy="104" r="7" fill="#0B1B33"/>
<circle cx="118" cy="104" r="7" fill="#0B1B33"/>
<path d="M88 120 Q100 128 112 120" fill="none" stroke="#0B1B33" stroke-width="4" stroke-linecap="round"/>
<g opacity="{{o4}}">
<rect x="78" y="142" width="44" height="14" rx="7" fill="#FFB27A"/>
<rect x="86" y="147" width="28" height="4" rx="2" fill="#A23B00"/>
</g>
<g opacity="{{o3}}">
<rect x="14" y="88" width="26" height="48" rx="8" fill="#FFB27A" stroke="#A23B00" stroke-width="3"/>
<line x1="21" y1="100" x2="33" y2="100" stroke="#A23B00" stroke-width="3" stroke-linecap="round"/>
<line x1="21" y1="110" x2="33" y2="110" stroke="#A23B00" stroke-width="3" stroke-linecap="round"/>
<line x1="21" y1="120" x2="30" y2="120" stroke="#A23B00" stroke-width="3" stroke-linecap="round"/>
</g>
<g opacity="{{o2}}">
<circle cx="172" cy="112" r="18" fill="#E3ECFB" stroke="#0B1B33" stroke-width="3"/>
<circle cx="172" cy="112" r="6" fill="#E8772E"/>
<line x1="172" y1="94" x2="172" y2="100" stroke="#0B1B33" stroke-width="3" stroke-linecap="round"/>
</g>
</svg>
<div style="font-size: 14px; font-weight: 600; color: #4A5872">Модулей: {{level}} из 5</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"level":{"editor":"range","default":5,"min":0,"max":5,"step":1,"section":"Персонаж"},"$preview":{"width":320,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    const l = Number(this.props.level ?? 5);
    const o = (n) => (l >= n ? 1 : 0.14);
    return { level: l, o1: o(1), o2: o(2), o3: o(3), o4: o(4), o5: o(5) };
  }
}
</script>
</body>
</html>
