<!doctype html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>S02 Предмет и классы</title>

<style>
html.solo{background:#E9EDF5}
html.solo body{display:flex;justify-content:center;padding:24px 16px;min-height:100vh;box-sizing:border-box}
html.framed body{margin:0}
</style>
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
.scr{width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F3F5FA;color:#0B1B33;font-family:'Onest',sans-serif;font-size:15px;line-height:1.4;overflow:hidden}
.scr *{box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:12px;font-family:inherit;font-size:16px;font-weight:600;border:0;cursor:pointer}
.btn.p{background:#0047BA;color:#fff}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:22px;background:#fff;border:1.5px solid #C4CFE3;font-family:inherit;font-size:15px;font-weight:600;color:#0B1B33;cursor:pointer}
.pill.on{background:#0047BA;border-color:#0047BA;color:#fff}
.lbl{font-size:13px;font-weight:700;color:#4A5872;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
</style>

<div class="scr" style="padding:20px 24px 24px">
  <div style="display:flex;gap:6px;padding-top:8px">
    <div style="flex:1;height:6px;border-radius:3px;background:#0047BA"></div>
    <div style="flex:1;height:6px;border-radius:3px;background:#0047BA"></div>
    <div style="flex:1;height:6px;border-radius:3px;background:#C4CFE3"></div>
  </div>
  <div style="padding-top:32px">
    <h1 style="margin:0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.01em">Что вы преподаёте?</h1>
    <p style="margin:12px 0 0;color:#4A5872">Ассистент настроится под ваш предмет. Это можно изменить позже в настройках.</p>
  </div>
  <div style="flex:1;padding-top:24px;overflow:hidden">
    <div class="lbl">Предмет</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <button class="pill on">Математика</button>
      <button class="pill">Русский язык</button>
      <button class="pill">Казахский язык</button>
      <button class="pill">История</button>
      <button class="pill">Биология</button>
      <button class="pill">Физика</button>
      <button class="pill">Английский</button>
      <button class="pill">Начальные классы</button>
      <button class="pill">Другой предмет</button>
    </div>
    <div class="lbl" style="margin-top:28px">Классы</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <button class="pill">1–4</button>
      <button class="pill on">5–7</button>
      <button class="pill on">8–9</button>
      <button class="pill">10–11</button>
    </div>
  </div>
  <a class="btn p" href="S03.html" style="text-decoration:none">Далее</a>
</div>


<script>
(function(){
  var framed = window.top !== window;
  document.documentElement.className += framed ? ' framed' : ' solo';
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href]');
    if(!a || !framed) return;
    var m = a.getAttribute('href').match(/(?:^|\/)([A-Za-z0-9]+)\.html$/);
    if(!m) return;
    e.preventDefault();
    window.top.postMessage({ craftGo: m[1] }, '*');
  });
})();
</script>
</body>
</html>
