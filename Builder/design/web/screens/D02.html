<!doctype html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>D02 Данные за рубежом</title>

<style>
html.solo{background:#E9EDF5}
html.solo body{display:flex;justify-content:center;padding:24px 16px;min-height:100vh;box-sizing:border-box}
html.framed body{margin:0}
</style>
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
.scr{width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;position:relative;background:#F3F5FA;color:#0B1B33;font-family:'Onest',sans-serif;font-size:15px;line-height:1.4;overflow:hidden}
.scr *{box-sizing:border-box}
a{color:inherit;text-decoration:none}
.body{flex:1;overflow:hidden;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.lead{font-size:14px;color:#4A5872}
.lb{font-size:12px;font-weight:700;color:#4A5872;letter-spacing:.06em;text-transform:uppercase}
.cap{font-family:'JetBrains Mono',monospace;font-size:12px;color:#4A5872}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-family:inherit;font-size:16px;font-weight:600;border:0;white-space:nowrap}
.btn.p{background:#0047BA;color:#fff}
.btn.s{background:#fff;color:#0047BA;border:1.5px solid #0047BA}
.btn.df{background:#A23B00;color:#fff}
.btn.g{background:transparent;color:#0047BA}
.btn.sm{min-height:44px;font-size:15px;padding:0 14px}
.ib{flex:none;width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:#0047BA}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;background:#E3ECFB;color:#0047BA;font-size:12px;font-weight:600;white-space:nowrap}
.chip.o{background:#FFE8D6;color:#A23B00}
.chip.n{background:#F3F5FA;color:#4A5872}
.card{background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(11,27,51,.08)}
.hd{display:flex;align-items:center;gap:10px}
.tile{flex:none;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#E3ECFB;color:#0047BA}
.tile.o{background:#FFE8D6;color:#A23B00}
.tile.lg{width:48px;height:48px;border-radius:14px}
.ttl{flex:1;min-width:0;font-size:16px;font-weight:700;line-height:1.2}
.item{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;background:#F3F5FA;font-size:14px}
.row{display:flex;align-items:center;gap:10px;min-height:44px}
.sub{font-size:12.5px;color:#4A5872;line-height:1.35}
.sw{flex:none;width:52px;height:32px;border-radius:16px;background:#C4CFE3;position:relative}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:#fff}
.sw.on{background:#0047BA}
.sw.on::after{left:auto;right:3px}
.hint{background:#E3ECFB;border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:8px}
.warn{background:#fff;border:1.5px solid #E8772E;border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:8px}
.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.5}
.field{min-height:48px;display:flex;align-items:center;padding:0 14px;border-radius:12px;background:#fff;border:1px solid #D3DBEA;font-size:15px}
.dim{position:absolute;inset:0;background:rgba(11,27,51,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:12px 24px 32px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px rgba(11,27,51,.14)}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:#C4CFE3}
.sheet h1{margin:0;font-size:24px;line-height:1.2;font-weight:700}
.bot{display:flex;gap:10px;padding:12px 16px 24px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;font-size:12px;font-weight:600;color:#4A5872}
.tab.on{color:#0047BA}
.step{flex:1;height:6px;border-radius:3px;background:#C4CFE3}
.step.on{background:#0047BA}
</style>

<div class="scr">
<div style="display:flex;align-items:center;gap:4px;padding:10px 8px 8px 4px;background:#fff;border-bottom:1px solid #E3ECFB"><a class="ib" href="#" aria-label="Назад"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><div style="flex:1;font-size:18px;font-weight:700">Модель ассистента</div></div><div class="body"><div class="card" style="height:120px"></div><div class="card" style="height:160px"></div><div class="card" style="height:120px"></div></div><div class="dim"></div><div class="sheet"><div class="grab"></div>
<div class="tile lg o"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></div>
<h1>Запросы уходят за рубеж</h1>
<div style="color:#4A5872">Ваш вопрос, инструкция, память и найденные фрагменты документов отправляются к модели через сервер CraftAI. Сервер тексты не хранит.</div>
<div style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600">
  <span class="chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="3"/><path d="M11 18h2"/></svg>Телефон</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4A5872" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span class="chip">CraftAI</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4A5872" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span class="chip o"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Модель</span>
</div>
<div class="warn"><span style="color:#A23B00"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></span><span>Не отправляйте данные учеников: ФИО, оценки, диагнозы, контакты родителей.</span></div>
<a class="btn p" href="Main.html">Понятно</a>
<a class="btn s" href="Main.html">Не сейчас</a></div>
</div>


<script>
(function(){
  var framed = window.top !== window;
  document.documentElement.className += framed ? ' framed' : ' solo';
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href]');
    if(!a || !framed) return;
    var m = a.getAttribute('href').match(/(?:^|\/)([A-Za-z0-9]+)\.html$/);
    if(!m) return;
    e.preventDefault();
    window.top.postMessage({ craftGo: m[1] }, '*');
  });
})();
</script>
</body>
</html>
