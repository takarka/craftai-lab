<!doctype html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>S03 Ваш ассистент</title>

<style>
html.solo{background:#E9EDF5}
html.solo body{display:flex;justify-content:center;padding:24px 16px;min-height:100vh;box-sizing:border-box}
html.framed body{margin:0}
</style>
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
.scr{width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F3F5FA;color:#0B1B33;font-family:'Onest',sans-serif;font-size:15px;line-height:1.4;overflow:hidden}
.scr *{box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:12px;font-family:inherit;font-size:16px;font-weight:600;border:0;cursor:pointer}
.btn.p{background:#0047BA;color:#fff}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#4A5872}
.fld input{min-height:48px;border-radius:12px;border:1px solid #C4CFE3;background:#fff;padding:0 14px;font-family:inherit;font-size:16px;color:#0B1B33}
</style>

<div class="scr" style="padding:20px 24px 24px">
  <div style="display:flex;gap:6px;padding-top:8px">
    <div style="flex:1;height:6px;border-radius:3px;background:#0047BA"></div>
    <div style="flex:1;height:6px;border-radius:3px;background:#0047BA"></div>
    <div style="flex:1;height:6px;border-radius:3px;background:#0047BA"></div>
  </div>
  <div style="padding-top:32px">
    <h1 style="margin:0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.01em">Встречайте вашего ассистента</h1>
    <p style="margin:12px 0 0;color:#4A5872">Пока он пустой: без инструкций, памяти и знаний. Вы соберёте его шаг за шагом.</p>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
    <svg viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Пустой персонаж, ни одного модуля">
      <g opacity="0.14">
        <line x1="100" y1="56" x2="100" y2="36" stroke="#0B1B33" stroke-width="5" stroke-linecap="round"/>
        <circle cx="100" cy="28" r="10" fill="#E8772E"/>
        <rect x="14" y="88" width="26" height="48" rx="8" fill="#FFB27A" stroke="#A23B00" stroke-width="3"/>
        <circle cx="172" cy="112" r="18" fill="#E3ECFB" stroke="#0B1B33" stroke-width="3"/>
        <rect x="62" y="158" width="26" height="22" rx="8" fill="#0B1B33"/>
        <rect x="112" y="158" width="26" height="22" rx="8" fill="#0B1B33"/>
      </g>
      <rect x="40" y="56" width="120" height="108" rx="34" fill="#0047BA"/>
      <rect x="56" y="76" width="88" height="58" rx="22" fill="#E3ECFB"/>
      <circle cx="82" cy="104" r="7" fill="#0B1B33"/>
      <circle cx="118" cy="104" r="7" fill="#0B1B33"/>
      <path d="M90 122 H110" fill="none" stroke="#0B1B33" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <div style="font-size:13px;color:#4A5872">Модулей: 0 из 5 · пройдите уровень, чтобы получить первый</div>
  </div>
  <label class="fld" style="margin-bottom:16px">Как назовёте ассистента?
    <input type="text" placeholder="Например, Помощник по математике">
  </label>
  <a class="btn p" href="D02.html" style="text-decoration:none">Начать</a>
</div>


<script>
(function(){
  var framed = window.top !== window;
  document.documentElement.className += framed ? ' framed' : ' solo';
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href]');
    if(!a || !framed) return;
    var m = a.getAttribute('href').match(/(?:^|\/)([A-Za-z0-9]+)\.html$/);
    if(!m) return;
    e.preventDefault();
    window.top.postMessage({ craftGo: m[1] }, '*');
  });
})();
</script>
</body>
</html>
