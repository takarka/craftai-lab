<!doctype html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>S00 Вход</title>

<style>
html.solo{background:#E9EDF5}
html.solo body{display:flex;justify-content:center;padding:24px 16px;min-height:100vh;box-sizing:border-box}
html.framed body{margin:0}
</style>
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
.scr{width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F3F5FA;color:#0B1B33;font-family:'Onest',sans-serif;font-size:15px;line-height:1.4;overflow:hidden}
.scr *{box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:12px;font-family:inherit;font-size:16px;font-weight:600;border:0;cursor:pointer}
.btn.p{background:#0047BA;color:#fff}
.btn.s{background:#fff;color:#0047BA;border:1.5px solid #0047BA}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#4A5872}
.fld input{min-height:48px;border-radius:12px;border:1px solid #C4CFE3;background:#fff;padding:0 14px;font-family:inherit;font-size:16px;color:#0B1B33}
</style>

<div class="scr" style="padding:0 24px">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-top:24px">
    <svg viewBox="0 0 200 200" width="132" height="132" role="img" aria-label="Персонаж Craft Builder">
      <line x1="100" y1="56" x2="100" y2="36" stroke="#0B1B33" stroke-width="5" stroke-linecap="round"/>
      <circle cx="100" cy="28" r="10" fill="#E8772E"/>
      <rect x="40" y="56" width="120" height="108" rx="34" fill="#0047BA"/>
      <rect x="56" y="76" width="88" height="58" rx="22" fill="#E3ECFB"/>
      <circle cx="82" cy="104" r="7" fill="#0B1B33"/>
      <circle cx="118" cy="104" r="7" fill="#0B1B33"/>
      <path d="M88 120 Q100 128 112 120" fill="none" stroke="#0B1B33" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <h1 style="margin:0;font-size:30px;font-weight:700;letter-spacing:-.01em">Craft Builder</h1>
    <div style="text-align:center;color:#4A5872;max-width:290px">Соберите собственного ИИ-ассистента и поймите, как он устроен.</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:14px;padding-bottom:24px">
    <label class="fld">Почта
      <input type="email" placeholder="name@school.kz">
    </label>
    <label class="fld">Пароль
      <input type="password" placeholder="••••••••">
    </label>
    <a class="btn p" href="S01.html" style="text-decoration:none;margin-top:4px">Войти</a>
    <a class="btn s" href="S01.html" style="text-decoration:none">Создать аккаунт</a>
    <div style="text-align:center;font-size:12px;color:#4A5872;padding-top:4px">Один аккаунт CraftAI для всех продуктов.<br>Ассистент и данные хранятся на этом телефоне.</div>
  </div>
</div>


<script>
(function(){
  var framed = window.top !== window;
  document.documentElement.className += framed ? ' framed' : ' solo';
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href]');
    if(!a || !framed) return;
    var m = a.getAttribute('href').match(/(?:^|\/)([A-Za-z0-9]+)\.html$/);
    if(!m) return;
    e.preventDefault();
    window.top.postMessage({ craftGo: m[1] }, '*');
  });
})();
</script>
</body>
</html>
