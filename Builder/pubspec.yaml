name: builder
description: "Craft Builder — Flutter UI Kit."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/character.svg
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-400.ttf
          weight: 400
        - asset: assets/fonts/Onest-500.ttf
          weight: 500
        - asset: assets/fonts/Onest-600.ttf
          weight: 600
        - asset: assets/fonts/Onest-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
