name: builder
description: "Craft Builder — самостоятельный учебный ИИ-ассистент."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.2.0
  go_router: ^18.1.0
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.4+2
  http: ^1.6.0
  flutter_markdown: ^0.7.7+1
  archive: ^4.5.2
  xml: ^7.0.1
  url_launcher: ^6.3.2
  http_parser: ^4.1.2
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  open_filex: ^5.0.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/character.svg
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-400.ttf
          weight: 400
        - asset: assets/fonts/Onest-500.ttf
          weight: 500
        - asset: assets/fonts/Onest-600.ttf
          weight: 600
        - asset: assets/fonts/Onest-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
