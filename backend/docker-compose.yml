services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: craftai
      POSTGRES_PASSWORD: ${CRAFTAI_POSTGRES_PASSWORD:-craftai_dev_password}
      POSTGRES_DB: craftai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craftai -d craftai"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CRAFTAI_APP_ENV: ${CRAFTAI_APP_ENV:-dev}
      CRAFTAI_DATABASE_URL: ${CRAFTAI_DATABASE_URL:-postgresql+asyncpg://craftai:craftai_dev_password@postgres:5432/craftai}
      CRAFTAI_STORAGE_DIR: /data/storage
      CRAFTAI_JWT_SECRET: ${CRAFTAI_JWT_SECRET:-change-me-in-production-min-32-bytes-secret}
      CRAFTAI_OPENROUTER_API_KEY: ${CRAFTAI_OPENROUTER_API_KEY:-}
      CRAFTAI_BRAVE_SEARCH_API_KEY: ${CRAFTAI_BRAVE_SEARCH_API_KEY:-}
    ports:
      - "5001:5001"
    volumes:
      - storage_data:/data/storage

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: [backup]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: craftai
      PGDATABASE: craftai
      PGPASSWORD: ${CRAFTAI_POSTGRES_PASSWORD:-craftai_dev_password}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    entrypoint: ["/bin/sh", "/opt/postgres-backup.sh"]
    volumes:
      - ./ops/postgres-backup.sh:/opt/postgres-backup.sh:ro
      - backup_data:/backups

volumes:
  postgres_data:
  storage_data:
  backup_data:
