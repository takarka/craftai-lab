services:
  - type: web
    name: craftai-lab-api
    runtime: docker
    plan: free
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "5001"
      - key: CRAFTAI_APP_ENV
        value: production
      # Supply a persistent PostgreSQL URL before deploying this revision.
      - key: CRAFTAI_DATABASE_URL
        sync: false
      - key: CRAFTAI_JWT_SECRET
        generateValue: true
      - key: CRAFTAI_OPENROUTER_API_KEY
        sync: false
